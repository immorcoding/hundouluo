<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THROWAWAY 四区 HUD：紧凑 / 宽松</title>
<style>
body{background:#111a24;color:#e5eef4;font:15px system-ui;margin:24px;padding-bottom:100px}h1{font-size:22px}p{max-width:1100px;color:#adbfca}button{font:inherit;color:#e5eef4;background:#263b4e;border:1px solid #688092;padding:8px 13px;cursor:pointer}button[aria-pressed=true]{background:#8de9ed;color:#071421}button:focus-visible{outline:3px solid #ffc578}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.pictures{display:flex;gap:20px;width:max-content}figure{margin:0}figcaption{color:#ffc578;margin-bottom:8px}img{display:block;width:640px;height:360px;image-rendering:pixelated}.double img{width:1280px;height:720px}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#233446;border:2px solid #6c899b;padding:12px;display:flex;align-items:center;gap:16px;white-space:nowrap}a{color:#8de9ed}
</style>
<h1>THROWAWAY · 草图四区结构 / 两档比例</h1>
<p>独立本轮对照，非 A–E 第六变体。头像独立纵栏、武器中上、生命中下、铜色弹壳右列。草图标签不是游戏文案。半/全自动只作概念示意，正式游戏尚无模式切换。</p>
<p>共用 #28 后 main 3f970aa 同帧，42 HP。紧凑 204×72；宽松 240×88。宽松案会遮少量角色脚部和地面边缘，两案都会遮左侧缺口下部；不自动避让。</p>
<div class="controls">
<button data-state="normal">1 普通交火</button><button data-state="combat">2 机甲战</button><button data-state="low">3 低血1/3</button><button data-state="gap-left">4 左侧缺口</button>
<button id="semi">半自动示意：1枚实心</button><button id="auto">全自动示意：3枚实心</button><button id="pair">两比例并排</button><button id="scale">原生640×360</button>
</div>
<div id="pictures" class="pictures"><figure><figcaption id="leftTitle"></figcaption><img id="left" alt="四区HUD原型"></figure><figure id="second" hidden><figcaption>宽松 · 240×88</figcaption><img id="right" alt="宽松方案"></figure></div>
<p id="status" aria-live="polite"></p>
<p>请比较：紧凑是否已接近草图的分区？宽松增加的识别度是否值得遮挡？半自动空壳与生命空槽是否仍好区分？<a href="README.md">来源、尺寸与风险记录</a></p>
<nav class="switcher" aria-label="临时原型切换器"><button id="prev" aria-label="前一比例">←</button><strong id="current"></strong><button id="next" aria-label="后一比例">→</button></nav>
<script>
const names={compact:'紧凑 204×72',roomy:'宽松 240×88'},states={normal:'普通交火',combat:'机甲战',low:'低血1/3','gap-left':'左侧缺口'};
const q=new URLSearchParams(location.search);let variant=q.get('variant')==='roomy'?'roomy':'compact',mode=q.get('mode')==='semi'?'semi':'auto',state=Object.hasOwn(states,q.get('state'))?q.get('state'):'combat',pair=false,double=false;
function render(){
 const left=pair?'compact':variant;
 document.getElementById('left').src=`images/${left}-${mode}-${state}.png`;
 document.getElementById('right').src=`images/roomy-${mode}-${state}.png`;
 document.getElementById('leftTitle').textContent=names[left];document.getElementById('second').hidden=!pair;
 document.getElementById('pictures').classList.toggle('double',double);
 const concept=mode==='semi'?'半自动概念 · 1枚实心/2枚空壳':'全自动概念 · 3枚实心';
 document.getElementById('current').textContent=`临时原型 ${names[variant]}`;
 document.getElementById('status').textContent=`${pair?'两比例并排':names[variant]} | ${states[state]} | 生命${state==='low'?1:3}/3 | ${['normal','gap-left'].includes(state)?'Boss未激活':'Boss28/42'} | ${concept}（未实现玩法） | ${double?'整数2×':'原生'}`;
 document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===state));
 document.getElementById('semi').setAttribute('aria-pressed',mode==='semi');document.getElementById('auto').setAttribute('aria-pressed',mode==='auto');document.getElementById('pair').setAttribute('aria-pressed',pair);document.getElementById('scale').textContent=double?'2×1280×720':'原生640×360';
 const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('mode',mode);url.searchParams.set('state',state);history.replaceState(null,'',url);
}
function flip(){variant=variant==='compact'?'roomy':'compact';pair=false;render()}
document.getElementById('prev').onclick=flip;document.getElementById('next').onclick=flip;
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;render()});
for(const m of ['semi','auto'])document.getElementById(m).onclick=()=>{mode=m;render()};
document.getElementById('pair').onclick=()=>{pair=!pair;render()};document.getElementById('scale').onclick=()=>{double=!double;render()};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();flip()}if(['1','2','3','4'].includes(e.key)){state=Object.keys(states)[Number(e.key)-1];render()}});render();
</script></html>
