<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>THROWAWAY 四区 HUD：紧凑 / 宽松</title>
<style>
body{background:#111a24;color:#e5eef4;font:15px system-ui;margin:24px;padding-bottom:100px}h1{font-size:22px}p{max-width:1100px;color:#adbfca}button{font:inherit;color:#e5eef4;background:#263b4e;border:1px solid #688092;padding:8px 13px;cursor:pointer}button[aria-pressed=true]{background:#8de9ed;color:#071421}button:focus-visible{outline:3px solid #ffc578}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.pictures{display:flex;gap:20px;width:max-content}figure{margin:0}figcaption{color:#ffc578;margin-bottom:8px}img{display:block;width:640px;height:360px;image-rendering:pixelated}.double img{width:1280px;height:720px}.switcher{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#233446;border:2px solid #6c899b;padding:12px;display:flex;align-items:center;gap:16px;white-space:nowrap}a{color:#8de9ed}
</style>
<h1>THROWAWAY · 保留旧头像 / 保留新比例 / 缩小弹壳 / 统一枪形</h1>
<p>严格恢复1137dda详细头像原素材/原裁切/48×48显示；保留S6/S4尺寸位置，弹壳22×9减为18×7，枪械匹配旧头像材质。半/全自动仍仅概念。</p>
<p>S6为192×68/左下6px；S4为184×64/左下4px。旧头像指1137dda详细青白头盔；修正前按钮显示的是上轮误换的块状头像，供前后比较。共用#28后42HP原始同帧，不清理背景或弹丸；缺口下部仍有遮挡。</p>
<div class="controls">
<button data-state="normal">1 普通交火</button><button data-state="combat">2 机甲战</button><button data-state="low">3 低血1/3</button><button data-state="gap-left">4 左侧缺口</button>
<button id="semi">半自动示意：1枚实心</button><button id="auto">全自动示意：3枚实心</button><button id="pair">当前尺寸修正前后</button><button id="smallPair">修正后 S6 / S4</button><button id="scale">原生640×360</button>
</div>
<div id="pictures" class="pictures"><figure><figcaption id="leftTitle"></figcaption><img id="left" alt="四区HUD原型"></figure><figure id="second" hidden><figcaption id="rightTitle"></figcaption><img id="right" alt="宽松方案"></figure></div>
<p id="status" aria-live="polite"></p>
<p>请核对四点：旧详细头像是否已正确恢复？新比例是否合适？较小弹壳是否可辨？枪形与旧头像是否协调？<a href="README.md">来源、尺寸与风险记录</a></p>
<nav class="switcher" aria-label="临时原型切换器"><button id="prev" aria-label="前一比例">←</button><strong id="current"></strong><button id="next" aria-label="后一比例">→</button></nav>
<script>
const names={six:'S6 · 192×68 / 6px',four:'S4 · 184×64 / 4px'},states={normal:'普通交火',combat:'机甲战',low:'低血1/3','gap-left':'左侧缺口'};
const q=new URLSearchParams(location.search);let variant=Object.hasOwn(names,q.get('variant'))?q.get('variant'):'six',mode=q.get('mode')==='semi'?'semi':'auto',state=Object.hasOwn(states,q.get('state'))?q.get('state'):'gap-left',pair=null,double=false;
function render(){
 const left=pair==='fits'?'six':variant,right=pair==='fits'?'four':variant;
 const before=pair==='before';
 document.getElementById('left').src=`${before?'../throwaway-pixel-fit/':''}images/${left}-${mode}-${state}.png`;
 document.getElementById('right').src=`images/${right}-${mode}-${state}.png`;
 document.getElementById('leftTitle').textContent=(before?'修正前（上轮块状头像） · ':'修正后 · ')+names[left];document.getElementById('rightTitle').textContent='修正后 · '+names[right];document.getElementById('second').hidden=!pair;
 document.getElementById('pictures').classList.toggle('double',double);
 const concept=mode==='semi'?'半自动概念 · 1枚实心/2枚空壳':'全自动概念 · 3枚实心';
 document.getElementById('current').textContent=`临时原型 ${names[variant]}`;
 document.getElementById('status').textContent=`${pair?names[left]+' / '+names[right]:names[variant]} | ${states[state]} | 生命${state==='low'?1:3}/3 | ${['normal','gap-left'].includes(state)?'Boss未激活':'Boss28/42'} | ${concept}（未实现玩法） | ${double?'整数2×':'原生'}`;
 document.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.state===state));
 document.getElementById('semi').setAttribute('aria-pressed',mode==='semi');document.getElementById('auto').setAttribute('aria-pressed',mode==='auto');document.getElementById('pair').setAttribute('aria-pressed',pair==='before');document.getElementById('smallPair').setAttribute('aria-pressed',pair==='fits');document.getElementById('scale').textContent=double?'2×1280×720':'原生640×360';
 const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('mode',mode);url.searchParams.set('state',state);history.replaceState(null,'',url);
}
function flip(step){const keys=['six','four'];variant=keys[(keys.indexOf(variant)+step+2)%2];pair=null;render()}
document.getElementById('prev').onclick=()=>flip(-1);document.getElementById('next').onclick=()=>flip(1);
document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{state=b.dataset.state;render()});
for(const m of ['semi','auto'])document.getElementById(m).onclick=()=>{mode=m;render()};
document.getElementById('pair').onclick=()=>{pair='before';render()};document.getElementById('smallPair').onclick=()=>{pair='fits';render()};document.getElementById('scale').onclick=()=>{double=!double;render()};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,[contenteditable]'))return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();flip(e.key==='ArrowLeft'?-1:1)}if(['1','2','3','4'].includes(e.key)){state=Object.keys(states)[Number(e.key)-1];render()}});render();
</script></html>
